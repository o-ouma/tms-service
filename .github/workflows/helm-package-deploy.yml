name: Helm Package Deploy

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'The version of the chart to deploy'
        required: true
        default: '0.1.0'

jobs:
  deploy-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.1

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          config-file: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy Helm chart
        run: |
          helm upgrade --install tms-service oci://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tms-service --version ${{ github.event.inputs.chart_version }} --namespace processor --create-namespace
