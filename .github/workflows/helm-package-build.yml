name: Helm Package Build

on:
  push:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tms-service:latest

  lint-and-test-chart:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.1

      - name: Lint Helm chart
        run: helm lint ./charts/tms-service

      - name: Render Helm chart templates
        run: |
          helm template tms-service ./charts/tms-service --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/tms-service --set image.tag=latest

  package-and-push-chart:
    runs-on: ubuntu-latest
    needs: lint-and-test-chart
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package ./charts/tms-service

      - name: Push Helm chart to Docker Hub
        run: |
          helm push *.tgz oci://docker.io/${{ secrets.DOCKERHUB_USERNAME }}
